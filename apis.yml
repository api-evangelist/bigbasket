name: bigbasket
description: 'bigbasket is India''s largest online grocery and daily-essentials retailer, now part of the
  Tata Group, delivering fresh produce, packaged foods, household, and personal-care products across Indian
  cities via web and mobile apps (bigbasket, bbnow, and bbdaily subscription delivery). Surfaced as a
  Bessemer Venture Partners portfolio company and added to the API Evangelist network. bigbasket operates
  as a consumer app rather than an API platform: it publishes no public developer portal, API documentation,
  or client SDKs. Its only first-party public developer surface is the github.com/BigBasket organization and
  the open-source @bb-tech react-admin UI component libraries on npm.'
